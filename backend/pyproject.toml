[project]
name = "engine-rag-backend"
version = "0.1.0"
description = "API de Engine RAG (ThanatosLabs)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.6",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.1",
    "pyjwt>=2.15.1",
    "pymupdf>=1.25.5",
    "python-docx>=1.1.2",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "-m", "not integration and not model and not load and not ollama"]
markers = [
    "integration: dependencias externas reales; queda fuera de la suite por defecto",
    "model: carga de modelos; queda fuera de la suite por defecto",
    "load: pruebas de carga; queda fuera de la suite por defecto",
    "ollama: generación con Ollama local; queda fuera de la suite por defecto",
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
