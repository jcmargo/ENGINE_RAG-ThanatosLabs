# Simulacro aislado. No comparte volúmenes con el stack de producto ni con el local.
# La contraseña es desechable y solo vive en esta base vacía.

name: engine-rag-drill

services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: engine_rag
      POSTGRES_PASSWORD: engine_rag_drill
      POSTGRES_DB: engine_rag
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - engine_rag_drill_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
      - "127.0.0.1:16333:6333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - engine_rag_drill_qdrant:/qdrant/storage

volumes:
  engine_rag_drill_postgres:
  engine_rag_drill_qdrant:
