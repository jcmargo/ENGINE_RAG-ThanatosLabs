# Configuración de Alembic. La URL tipada se toma de Settings en env.py.
# No guardar secretos aquí.

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
version_path_separator = os

# sqlalchemy.url se omite a propósito: env.py usa get_settings().database_url.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
